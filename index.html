:root{
  --ink:#1F2E24;
  --ink-soft:#4B5D50;
  --paper:#F6F1E6;
  --paper-2:#EDE4CF;
  --line:#D8CBAA;
  --pine:#233D2C;
  --pine-2:#2F4D38;
  --amber:#C17817;
  --amber-soft:#F0DAB8;
  --white:#FFFDF8;
  --gutter:40px;
}

*{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
body{margin:0;min-height:100vh;min-height:100dvh;background:var(--paper);font-family:'Public Sans',-apple-system,BlinkMacSystemFont,sans-serif;
  display:flex;align-items:center;justify-content:center;padding:20px 16px calc(20px + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased;}
a{color:inherit;text-decoration:none;-webkit-tap-highlight-color:transparent;}
.biz{position:relative;overflow:hidden;width:100%;max-width:400px;background:var(--pine);color:var(--white);border-radius:28px;
  padding:26px 22px 22px;text-align:center;box-shadow:0 24px 60px rgba(35,61,44,.28);}
.deco{position:absolute;right:-120px;top:-100px;width:360px;height:360px;opacity:.12;pointer-events:none;}
.lang{position:absolute;top:14px;right:14px;display:inline-flex;padding:3px;border-radius:999px;background:rgba(255,253,248,.1);border:1px solid rgba(255,253,248,.28);}
.lang a{display:inline-flex;align-items:center;justify-content:center;min-width:40px;min-height:30px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:700;letter-spacing:.06em;color:rgba(255,253,248,.8);}
.lang a[aria-current="page"]{background:var(--amber);color:var(--pine);}
.logo{position:relative;display:block;width:108px;height:108px;margin:14px auto 0;border-radius:50%;
  box-shadow:0 0 0 3px rgba(240,218,184,.45),0 12px 26px rgba(0,0,0,.35);}
.logo svg{width:100%;height:100%;}
h1{position:relative;font-family:'Fraunces',Georgia,serif;font-weight:700;font-size:32px;line-height:1.1;margin:18px 0 0;}
.cred{font-size:.62em;font-weight:600;white-space:nowrap;}
.title{position:relative;font-size:16px;font-weight:600;color:var(--amber-soft);margin:8px 0 0;}
.quote{position:relative;font-family:'Fraunces',Georgia,serif;font-style:italic;font-weight:500;font-size:17px;line-height:1.45;opacity:.92;margin:14px auto 0;max-width:300px;}
.nav{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px;}
.nav a{display:flex;align-items:center;justify-content:center;min-height:46px;border-radius:999px;border:1.5px solid rgba(255,253,248,.32);font-weight:600;font-size:15px;transition:background .15s,border-color .15s,color .15s;}
.nav a:hover,.nav a:active{background:var(--amber);border-color:var(--amber);color:var(--pine);}
.qr{position:relative;margin-top:22px;background:var(--paper);color:var(--ink);border-radius:20px;padding:18px 16px 16px;}
.qr a{display:block;width:180px;height:180px;margin:0 auto;padding:10px;background:#fff;border:1px solid var(--line);border-radius:14px;}
.qr svg{display:block;width:100%;height:100%;}
.qr-scan{font-size:14.5px;font-weight:700;color:var(--pine);margin:12px 0 0;}
.qr-tap{font-size:12.5px;color:var(--ink-soft);margin:3px 0 0;}
a:focus-visible{outline:3px solid var(--amber);outline-offset:3px;}
@media (max-width:360px){.logo{width:92px;height:92px;}h1{font-size:28px;}.qr a{width:160px;height:160px;}.nav a{font-size:14px;}}
@media (max-height:700px){.logo{width:84px;height:84px;margin-top:8px;}h1{margin-top:12px;}.qr a{width:150px;height:150px;}}

</style>
